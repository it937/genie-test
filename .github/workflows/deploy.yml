name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node via NVM
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          echo "$HOME/.nvm/versions/node/$(nvm version)/bin" >> $GITHUB_PATH

      - name: Copy new code to app directory
        run: |
          set -e
          rsync -av --delete --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            $GITHUB_WORKSPACE/ /var/www/genie-next-app/

      - name: Install dependencies
        run: |
          set -e
          cd /var/www/genie-next-app
          npm ci --prefer-offline

      - name: Build
        run: |
          set -e
          cd /var/www/genie-next-app
          npm run build

      - name: Restart PM2
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          pm2 restart genie-next-app
          pm2 save
